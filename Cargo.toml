[package]
name = "djgl-hk"
version = "0.1.0"
edition = "2021"

[dependencies]
ab_glyph = "0.2.32"
axum = { version = "0.8.9", features = ["multipart", "macros"] }
base64 = "0.22"
bytes = "1.12.1"
chrono = "0.4.45"
dotenvy = "0.15.7"
flate2 = "1.1.10"
futures = "0.3.34"
hex = "0.4.3"
hmac = "0.12"
http = "1.5.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
libc = "0.2.189"
log = { version = "0.4", features = ["std"] }
md-5 = "0.10"
mime_guess = "2.0.5"
once_cell = "1.21.4"
rand = "0.8"
regex = "1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart", "json", "gzip", "deflate", "stream"] }
roxmltree = "0.21.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust_xlsxwriter = "0.99.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.10"
tar = "0.4.46"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["io"] }
uuid = { version = "1.26.1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
